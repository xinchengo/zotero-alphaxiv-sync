<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2 data-l10n-id="pref-title"></html:h2></label>
  <hbox>
    <html:label for="zotero-prefpane-__addonRef__-alphaxivApiKey"
      >alphaXiv API Key</html:label
    >
    <html:input
      type="password"
      id="zotero-prefpane-__addonRef__-alphaxivApiKey"
      preference="alphaxivApiKey"
    ></html:input>
  </hbox>
  <hbox>
    <html:label for="zotero-prefpane-__addonRef__-alphaxivBaseUrl"
      >alphaXiv API Base URL</html:label
    >
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-alphaxivBaseUrl"
      preference="alphaxivBaseUrl"
      placeholder="https://api-dev.alphaxiv.org"
    ></html:input>
  </hbox>
  <hbox>
    <html:label for="zotero-prefpane-__addonRef__-syncPairs"
      >Sync pairs (JSON)</html:label
    >
  </hbox>
  <hbox>
    <html:textarea
      id="zotero-prefpane-__addonRef__-syncPairs"
      preference="syncPairs"
      rows="6"
      style="width: 100%"
    ></html:textarea>
  </hbox>
  <checkbox
    id="zotero-prefpane-__addonRef__-enable"
    preference="enable"
    data-l10n-id="pref-enable"
  />
  <hbox>
    <html:label
      for="zotero-prefpane-__addonRef__-input"
      data-l10n-id="pref-input"
    ></html:label>
    <html:input
      type="text"
      id="zotero-prefpane-__addonRef__-input"
      preference="input"
    ></html:input>
  </hbox>
  <hbox class="virtualized-table-container" flex="1" height="300px">
    <html:div id="__addonRef__-table-container" />
  </hbox>
</groupbox>
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
